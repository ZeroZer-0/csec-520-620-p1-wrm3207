name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (byte-compile)
        run: python -m compileall -q src tests tools data/build_dataset.py data/download_dataset.py report/make_report_assets.py
      - name: Smoke tests
        run: python -m pytest -q
      - name: Download dataset
        run: python data/download_dataset.py
      - name: Reproduce (sanity run)
        run: python -m src.train --config config.yaml